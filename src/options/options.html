<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-content="optionsTitle"></title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <img class="product-mark" src="../assets/icon-64.png" alt="">
        <div>
          <h1 data-i18n-content="optionsTitle"></h1>
          <p data-i18n-content="optionsStatusText"></p>
        </div>
      </header>

      <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>

      <section class="panel" aria-labelledby="oauth-heading">
        <h2 id="oauth-heading" data-i18n-content="optionsOAuthHeading"></h2>
        <p class="section-intro" data-i18n-content="optionsOAuthText"></p>

        <form id="oauth-form" novalidate>
          <div class="form-field">
            <label for="oauth-mode" data-i18n-content="optionsOAuthModeLabel"></label>
            <select id="oauth-mode" name="mode" aria-describedby="oauth-mode-help">
              <option value="builtin" data-i18n-content="optionsOAuthModeBuiltin"></option>
              <option value="custom" data-i18n-content="optionsOAuthModeCustom"></option>
            </select>
            <p id="oauth-mode-help" class="field-help"></p>
          </div>

          <dl class="oauth-summary">
            <div>
              <dt data-i18n-content="optionsOAuthSourceLabel"></dt>
              <dd id="oauth-source"></dd>
            </div>
            <div>
              <dt data-i18n-content="optionsOAuthEffectiveClientIdLabel"></dt>
              <dd><code id="oauth-effective-client-id"></code></dd>
            </div>
          </dl>

          <div id="oauth-custom-fields">
            <div class="form-field">
              <label for="oauth-client-id" data-i18n-content="optionsOAuthClientIdLabel"></label>
              <input id="oauth-client-id" name="clientId" type="text" autocomplete="off" spellcheck="false">
            </div>
            <div class="form-field">
              <label for="oauth-client-secret" data-i18n-content="optionsOAuthClientSecretLabel"></label>
              <input id="oauth-client-secret" name="clientSecret" type="password" autocomplete="new-password" spellcheck="false" aria-describedby="oauth-client-secret-help">
              <p id="oauth-client-secret-help" class="field-help" data-i18n-content="optionsOAuthClientSecretHelp"></p>
            </div>
          </div>

          <p id="oauth-managed-notice" class="managed-notice" data-i18n-content="optionsOAuthManagedNotice" hidden></p>
          <p class="data-notice" data-i18n-content="optionsOAuthChangeNotice"></p>

          <div class="form-actions">
            <button id="save-oauth" class="secondary-action" type="submit" data-i18n-content="optionsOAuthSave"></button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="accounts-heading">
        <div class="section-heading">
          <div>
            <h2 id="accounts-heading" data-i18n-content="optionsAccountsHeading"></h2>
            <p data-i18n-content="optionsAccountsText"></p>
            <p class="data-notice" data-i18n-content="optionsAccountsDataNotice"></p>
          </div>
          <button id="add-account" class="primary-action" type="button" data-i18n-content="optionsAddAccount"></button>
        </div>
        <ul id="account-list" class="account-list" aria-live="polite"></ul>
        <p id="no-accounts" class="empty-state" data-i18n-content="optionsNoAccounts"></p>
      </section>

      <section class="panel" aria-labelledby="connections-heading">
        <h2 id="connections-heading" data-i18n-content="optionsConnectionsHeading"></h2>
        <p class="section-intro" data-i18n-content="optionsConnectionsText"></p>
        <p class="data-notice" data-i18n-content="optionsConnectionRevokeNotice"></p>
        <ul id="connection-list" class="connection-list" aria-live="polite"></ul>
        <p id="no-connections" class="empty-state" data-i18n-content="optionsNoConnections"></p>
      </section>

      <section class="panel" aria-labelledby="preferences-heading">
        <h2 id="preferences-heading" data-i18n-content="optionsPreferencesHeading"></h2>
        <p class="section-intro" data-i18n-content="optionsPreferencesText"></p>

        <form id="preferences-form" novalidate>
          <label class="toggle-field" for="debug-logging">
            <input id="debug-logging" name="debugLogging" type="checkbox">
            <span data-i18n-content="optionsDebugLoggingLabel"></span>
          </label>

          <fieldset>
            <legend data-i18n-content="optionsExportsHeading"></legend>
            <div class="export-grid">
              <label for="export-document">
                <span data-i18n-content="optionsExportDocuments"></span>
                <select id="export-document" name="document">
                  <option value="docx" data-i18n-content="optionsFormatDocx"></option>
                  <option value="pdf" data-i18n-content="optionsFormatPdf"></option>
                </select>
              </label>
              <label for="export-spreadsheet">
                <span data-i18n-content="optionsExportSpreadsheets"></span>
                <select id="export-spreadsheet" name="spreadsheet">
                  <option value="xlsx" data-i18n-content="optionsFormatXlsx"></option>
                  <option value="pdf" data-i18n-content="optionsFormatPdf"></option>
                </select>
              </label>
              <label for="export-presentation">
                <span data-i18n-content="optionsExportPresentations"></span>
                <select id="export-presentation" name="presentation">
                  <option value="pptx" data-i18n-content="optionsFormatPptx"></option>
                  <option value="pdf" data-i18n-content="optionsFormatPdf"></option>
                </select>
              </label>
              <label for="export-drawing">
                <span data-i18n-content="optionsExportDrawings"></span>
                <select id="export-drawing" name="drawing">
                  <option value="pdf" data-i18n-content="optionsFormatPdf"></option>
                </select>
              </label>
            </div>
          </fieldset>

          <div class="form-actions">
            <button id="save-preferences" class="secondary-action" type="submit" data-i18n-content="optionsSavePreferences"></button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
